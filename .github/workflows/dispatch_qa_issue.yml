name: Dispatch QA Log Issue to Private Repo

on:
  repository_dispatch:
    types: [create_qa_issue]

jobs:
  create-private-qa-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create QA Issue in Private Repository
        uses: actions/github-script@v7
        env:
          TARGET_TOKEN: ${{ secrets.QA_PRIVATE_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.QA_PRIVATE_REPO_TOKEN }}
          script: |
            if (!process.env.TARGET_TOKEN) {
              core.setFailed("Missing required secret QA_PRIVATE_REPO_TOKEN in public runner repository.");
              return;
            }
            const p = context.payload.client_payload || {};
            const targetOwner = p.target_owner || "XAI-Medica";
            const targetRepo = p.target_repo || "qa-testing-log";
            const version = p.version || "unknown";
            const branchRange = p.branch_or_range || "unknown";
            const sha = p.commit_sha || "";
            const buildDate = p.build_date || "";
            const gdriveFolder = p.gdrive_task_folder || "";
            const gdriveRootUrl = p.gdrive_root_url || "https://drive.google.com/drive/folders/11S07O-WqCpy6ZhETvp9EUFbeQY0raMAq";
            const authorLogin = p.author_login || "unknown";
            const tcCount = p.test_cases_count || 0;
            const retestCount = p.retest_items_count || 0;
            const reqs = Array.isArray(p.requirements) ? p.requirements.join(", ") : "";
            const risks = Array.isArray(p.risks) ? p.risks.join(", ") : "";
            const notes = p.qa_notes || "_Нотатки не вказано_";

            const titleTag = sha ? `v${version} (${branchRange} @ ${sha})` : `v${version} (${branchRange})`;
            const body = [
              `### Паспорт тестової збірки REMET`,
              `- **Версія ПЗ:** \`${version}\``,
              `- **Гілка / Діпазон:** \`${branchRange}\``,
              `- **Коміт / Дата збірки:** \`${sha || "n/a"}\` (${buildDate || "n/a"})`,
              `- **Підготував:** @${authorLogin}`,
              `- **Папка на Google Drive:** \`${gdriveFolder}\` ([Відкрити спільну папку QA](${gdriveRootUrl}))`,
              `- **Обсяг тестів:** ${tcCount} тест-кейсів (TC-1..TC-${tcCount}) + ${retestCount} пунктів ре-тесту`,
              `- **Вимоги (REQ):** ${reqs || "n/a"}`,
              `- **Ризики (RISK):** ${risks || "n/a"}`,
              ``,
              `### Нотатки розробника`,
              notes,
              ``,
              `---`,
              `**Порядок роботи тестувальника:**`,
              `1. Призначте себе у **Assignees** та змініть мітку на \`qa:in-progress\`.`,
              `2. Завантажте \`Remet-Debug-App-Win32-*.7z\` та \`Remet-Debug-App-x64-*.7z\` із вказаної папки Google Drive і розпакуйте поверх \`Debug-Runtime\`.`,
              `3. Виконайте сценарії з \`QA_TEST_INSTRUCTIONS.md\`, покладіть \`QA_REPORT_DEV.md\` (і \`QA_REPORT_QMS.md\` при PASS) у папку Google Drive, додайте підсумок у коментар, встановіть мітку \`qa:passed\` або \`qa:failed\` та закрийте Issue.`
            ].join('\n');

            await github.rest.issues.create({
              owner: targetOwner,
              repo: targetRepo,
              title: `[QA] REMET ${titleTag}`,
              body: body,
              labels: ["qa:ready"]
            });
